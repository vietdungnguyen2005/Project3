name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run cf:build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw --batch-mode verify
        working-directory: backend
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      - run: docker build --tag vpulse-backend:ci backend
      - run: docker inspect --format='{{.Config.User}}' vpulse-backend:ci | grep -Fx vpulse
      - run: docker compose config --quiet
      - run: helm lint infra/helm/vpulse
      - run: helm template vpulse infra/helm/vpulse > rendered-manifests.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: Check and validate AWS infrastructure
        working-directory: infra/terraform/aws
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
